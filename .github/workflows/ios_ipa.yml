name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: '0.1.4'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FLUTTER_VERSION: stable

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Generate iOS project
        run: flutter create --platforms=ios .

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Flutter iOS build settings
        shell: bash
        run: |
          set +e
          flutter build ios --release --no-codesign
          set -e
          test -f ios/Flutter/Generated.xcconfig

      - name: Create unsigned iOS archive with Xcode
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/ios/Suicang.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
          APP="build/ios/Suicang.xcarchive/Products/Applications/Runner.app"
          test -f "$APP/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$executable"
          echo "APP_BUNDLE=$APP" >> "$GITHUB_ENV"

      - name: Package and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || '0.1.4' }}"
          APP="${APP_BUNDLE}"
          test -f "$APP/Info.plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          test -f "$APP/$executable"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Suicang.app
          ARCHIVE="build/ios/Suicang.xcarchive"
          if [[ -d "$ARCHIVE" ]]; then
            cp -R "$ARCHIVE" build/Suicang.xcarchive
          fi

      - name: Create and validate unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version || '0.1.4' }}"
          APP="${APP_BUNDLE}"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/Suicang.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload "build/Suicang-${VERSION}-unsigned.ipa"
          unzip -t "build/Suicang-${VERSION}-unsigned.ipa"
          unzip -p "build/Suicang-${VERSION}-unsigned.ipa" Payload/Suicang.app/Info.plist >/dev/null
          unzip -p "build/Suicang-${VERSION}-unsigned.ipa" "Payload/Suicang.app/$executable" >/dev/null
          shasum -a 256 "build/Suicang-${VERSION}-unsigned.ipa" > "build/Suicang-${VERSION}-unsigned.ipa.sha256"

      - name: Upload validated unsigned archive and IPA
        uses: actions/upload-artifact@v4
        with:
          name: Suicang-${{ inputs.version || '0.1.4' }}-unsigned-build
          path: |
            build/Suicang-${{ inputs.version || '0.1.4' }}-unsigned.ipa
            build/Suicang-${{ inputs.version || '0.1.4' }}-unsigned.ipa.sha256
            build/Suicang.xcarchive
          if-no-files-found: warn
          retention-days: 14

      - name: Publish unsigned IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version || '0.1.4' }}
          name: Suicang v${{ inputs.version || '0.1.4' }}
          body: |
            Suicang v${{ inputs.version || '0.1.4' }} iOS build.

            This is an unsigned IPA container. It is not directly runnable on iOS.
            Re-sign it with your Apple ID using SideStore, AltStore, Sideloadly, or Xcode.
          files: |
            build/Suicang-${{ inputs.version || '0.1.4' }}-unsigned.ipa
            build/Suicang-${{ inputs.version || '0.1.4' }}-unsigned.ipa.sha256
          overwrite_files: true
          prerelease: true
